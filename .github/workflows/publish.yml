name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install Rust toolchain
        # `bun run release:check` runs `contracts:check`, which regenerates the
        # contract artefacts and refuses to pass while the committed copies
        # disagree. `router/src/contracts.rs` and `crates/aibr-ipc/src/contracts.rs`
        # are emitted by `cargo run -p aibr-contract-gen`, so the gate needs
        # cargo -- without this step the release either fails on "cargo: command
        # not found" or, worse, the check is dropped to keep the release green.
        #
        # `@master` + an explicit `toolchain:` mirrors the pairing in
        # `.github/workflows/milestone-7.yml`, and the channel matches the one
        # `rust-toolchain.toml` pins in the tree. Leaving it to `@stable` builds
        # the artefacts with a different compiler than every other job does,
        # which is a drift that only shows up as an unexplainable diff.
        #
        # No `targets:` here: this step only compiles a generator for the host,
        # unlike the musl matrix.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - name: Read package manifest
        id: package
        run: echo "manifest=$(jq -c . package.json)" >> "$GITHUB_OUTPUT"

      - name: Verify release tag
        if: github.event.release.tag_name != format('v{0}', fromJSON(steps.package.outputs.manifest).version)
        run: |
          echo "Release tag must match the package version."
          exit 1

      - name: Validate release package
        run: bun run release:check

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg_dir in packages/*; do
            if [ -d "$pkg_dir" ] && [ -f "$pkg_dir/package.json" ]; then
              echo "Publishing platform package in $pkg_dir..."
              (cd "$pkg_dir" && npm publish --access public) || true
            fi
          done
          npm publish --access public
