name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        bun-version: ["1.3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Lint installer script
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/install.sh
          bash -n scripts/install.sh

      - name: Run tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      # ADR 0008 section 2.3. The generated contracts are COMMITTED so they are
      # reviewable in a pull request, which means a hand edit is indistinguishable
      # from a stale artefact unless something regenerates and diffs. This step is
      # the whole reason they are committed.
      #
      # Its own named step so a failure names the invariant: a regeneration that
      # moved, rather than a test that happened to fail nearby.
      # ADR 0008 section 2.3, and ADR 0010 section 2.2 for the second output.
      #
      # `crates/aibr-ipc/src/contracts.rs` is listed here because ADR 0010 split
      # `contracts/v1/` across TWO generated units: the router compiles the ingress
      # and orchestration families, the IPC crate compiles the daemon/client bus
      # families. Both are committed artefacts, so both are diffed -- omitting the
      # second would make a stale IPC contract look reproducible.
      - name: Contracts reproducible
        run: |
          bun run generate:contracts
          git diff --exit-code contracts/ router/src/contracts.rs crates/aibr-ipc/src/contracts.rs

      # The cross-language half. `router/tests/fixtures.rs` re-derives the
      # accept/reject vector from the generated Rust types and asserts it equals
      # the committed one, so this is where a TypeScript/Rust contract drift is
      # caught. It must run AFTER the reproducibility step: if generation moves
      # the artefacts, a parity failure would be reported as a parity problem.
      # The Cargo workspace root is the REPOSITORY root, not `router/`: ADR 0010
      # added `crates/*` as siblings of `router/` and Cargo refuses a member that is
      # not below its workspace root. So there is no `cd` here, and `cargo fmt` /
      # `clippy` / `test` now cover every shipped crate rather than the router
      # alone.
      - name: Rust contract parity
        run: |
          bun run generate:parity-vector
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: CLI smoke test
        run: bun dist/cli.js --help

      - name: Package dry-run
        run: bun pm pack --dry-run

  publish:
    name: Publish to npm on version bump
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check and publish package if version bumped
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          CURRENT_VERSION=$(jq -r .version package.json)
          PKG_NAME=$(jq -r .name package.json)
          LATEST_PUBLISHED=$(npm view "$PKG_NAME" version 2>/dev/null || echo "none")

          echo "Package: $PKG_NAME"
          echo "Current repository version: $CURRENT_VERSION"
          echo "Latest published npm version: $LATEST_PUBLISHED"

          if [ "$CURRENT_VERSION" != "$LATEST_PUBLISHED" ]; then
            echo "Version $CURRENT_VERSION is newer than published ($LATEST_PUBLISHED). Running release validation..."
            bun run release:check
            echo "Publishing $PKG_NAME@$CURRENT_VERSION to npm..."
            if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
              npm publish --access public
            else
              npm publish --access public --provenance || npm publish --access public
            fi
            echo "Successfully published $PKG_NAME@$CURRENT_VERSION to npm."
          else
            echo "Version $CURRENT_VERSION is already published to npm. No publish needed."
          fi
