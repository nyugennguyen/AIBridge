name: Publish npm package

# SOLE PUBLISHING AUTHORITY. This is the only workflow that may call
# `npm publish` or hold `NPM_TOKEN`. `.github/workflows/ci.yml` is
# validation-only: when both could publish, a version transition had two
# writers of one immutable npm version, and a publishing failure turned a
# passing code-verification run red.
on:
  release:
    types: [published]

permissions:
  contents: read
  # For npm OIDC trusted publishing / provenance. `NPM_TOKEN` (automation
  # token) remains supported as a fallback via `NODE_AUTH_TOKEN` below.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install Rust toolchain
        # `bun run release:check` runs `contracts:check`, which regenerates the
        # contract artefacts and refuses to pass while the committed copies
        # disagree. `router/src/contracts.rs` and `crates/aibr-ipc/src/contracts.rs`
        # are emitted by `cargo run -p aibr-contract-gen`, so the gate needs
        # cargo -- without this step the release either fails on "cargo: command
        # not found" or, worse, the check is dropped to keep the release green.
        #
        # `@master` + an explicit `toolchain:` mirrors the pairing in
        # `.github/workflows/milestone-7.yml`, and the channel matches the one
        # `rust-toolchain.toml` pins in the tree. Leaving it to `@stable` builds
        # the artefacts with a different compiler than every other job does,
        # which is a drift that only shows up as an unexplainable diff.
        #
        # No `targets:` here: this step only compiles a generator for the host,
        # unlike the musl matrix.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - name: Read package manifest
        id: package
        run: echo "manifest=$(jq -c . package.json)" >> "$GITHUB_OUTPUT"

      - name: Verify release tag
        if: github.event.release.tag_name != format('v{0}', fromJSON(steps.package.outputs.manifest).version)
        run: |
          echo "Release tag must match the package version."
          exit 1

      # npm versions are immutable. This preflight decides, PER PACKAGE, between
      # three outcomes before anything is published:
      #
      #   1. not published        -> queue for publish after validation
      #   2. published, and the registry's `gitHead` equals this release commit
      #                           -> "already published; skipped" (a re-run of a
      #                              release that already landed)
      #   3. published, but from another commit, or with no `gitHead` to verify
      #                           -> FAIL with a diagnostic: a new package
      #                              version is required, because the published
      #                              artifact cannot be proven to be this one
      #
      # This is the second line of defense behind having exactly one publishing
      # workflow. `npm view` alone is not authoritative release state -- it can
      # race a concurrent publish -- so a skip is only taken when the registry
      # metadata proves the artifact is this release's.
      - name: Publish preflight
        id: preflight
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_SHA=$(git rev-parse HEAD)
          PENDING=""

          # absent | matching:<gitHead> | unverifiable
          registry_state() {
            local name="$1" version="$2" git_head
            if ! npm view "$name@$version" version >/dev/null 2>&1; then
              echo "absent"
              return
            fi
            git_head=$(npm view "$name@$version" gitHead 2>/dev/null || echo "")
            if [ -z "$git_head" ] || [ "$git_head" = "null" ]; then
              echo "unverifiable"
              return
            fi
            echo "matching:$git_head"
          }

          check_pkg() {
            local dir="$1" name version state
            name=$(jq -r .name "$dir/package.json")
            version=$(jq -r .version "$dir/package.json")
            state=$(registry_state "$name" "$version")
            case "$state" in
              absent)
                echo "Queued for publish: $name@$version ($dir)"
                PENDING="$PENDING $dir"
                ;;
              matching:*)
                if [ "${state#matching:}" = "$RELEASE_SHA" ]; then
                  echo "$name@$version is already published from this release commit ($RELEASE_SHA); skipped."
                else
                  echo "::error::$name@$version is already published from commit ${state#matching:}, which is not this release commit ($RELEASE_SHA). npm versions are immutable: bump the version and cut a new release."
                  exit 1
                fi
                ;;
              unverifiable)
                echo "::error::$name@$version is already published but the registry carries no gitHead for it, so the artifact cannot be verified as this release's. Bump the version and cut a new release."
                exit 1
                ;;
            esac
          }

          for pkg_dir in packages/*; do
            if [ -d "$pkg_dir" ] && [ -f "$pkg_dir/package.json" ]; then
              check_pkg "$pkg_dir"
            fi
          done
          check_pkg .

          if [ -z "$PENDING" ]; then
            echo "All packages of this release are already published; nothing to do."
            echo "pending=" >> "$GITHUB_OUTPUT"
          else
            echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
          fi

      # Validation precedes publication and is skipped only when the preflight
      # proved there is nothing left to publish.
      - name: Validate release package
        if: steps.preflight.outputs.pending != ''
        run: bun run release:check

      # Publishes exactly the packages the preflight queued. Platform packages
      # (`packages/*`, installed via optionalDependencies) are REQUIRED once a
      # release names them: a failed publish here fails the release explicitly
      # instead of being swallowed, so a half-published release is visible
      # rather than silent.
      - name: Publish to npm
        if: steps.preflight.outputs.pending != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for pkg_dir in ${{ steps.preflight.outputs.pending }}; do
            name=$(jq -r .name "$pkg_dir/package.json")
            version=$(jq -r .version "$pkg_dir/package.json")
            echo "Publishing $name@$version from $pkg_dir ..."
            (cd "$pkg_dir" && npm publish --access public)
            echo "Published $name@$version."
          done
