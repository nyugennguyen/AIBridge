<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Container Base -->
  <rect width="512" height="512" rx="112" fill="#000000"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2"/>

  <!-- AIBridge Architectural Vector Symbol (Monochrome Pure White) -->
  <g transform="translate(0, 8)" stroke="#ffffff" fill="none">
    <!-- Base Spans -->
    <path d="M 104 368 L 408 368" stroke-width="12" stroke-linecap="round"/>

    <!-- Left & Right Pylons -->
    <path d="M 148 368 L 176 156 L 196 156 L 208 368" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 304 368 L 316 156 L 336 156 L 364 368" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Suspension Arc -->
    <path d="M 104 350 Q 186 168 256 220 Q 326 272 408 170" stroke-width="18" stroke-linecap="round"/>

    <!-- Counter Cable -->
    <path d="M 104 170 Q 186 272 256 220 Q 326 168 408 350" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 10" stroke-opacity="0.6"/>

    <!-- Terminal Prompt in Arch -->
    <g transform="translate(256, 284)">
      <path d="M -36 -28 L -6 0 L -36 28" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="6" y1="26" x2="36" y2="26" stroke-width="10" stroke-linecap="round"/>
    </g>

    <!-- Mesh Points -->
    <circle cx="104" cy="350" r="9" fill="#ffffff"/>
    <circle cx="408" cy="170" r="9" fill="#ffffff"/>
    <circle cx="186" cy="156" r="8" fill="#ffffff"/>
    <circle cx="326" cy="156" r="8" fill="#ffffff"/>
    <circle cx="256" cy="220" r="10" fill="#ffffff"/>
  </g>
</svg>
