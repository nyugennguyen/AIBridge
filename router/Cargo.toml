# Workspace root is ../Cargo.toml; this file is only the aibr-router package.
#
# It WAS both the workspace manifest and the `aibr-router` package manifest. It
# is now only the package manifest, because the TUI/daemon modernization plan
# adds Rust crates under `crates/` and Cargo refuses a member that is not
# hierarchically below its workspace root. `[profile.release]` moved to the root
# manifest for the same structural reason: Cargo honours profiles only there.
#
# The member crate's sources stay directly at `router/src/`, which is
# deliberate and unchanged: `router/src/contracts.rs` is a committed generated
# artefact whose path ADR 0008 2.3 fixes, and a separate member directory would
# put it at `router/aibr-router/src/contracts.rs` instead.

[package]
name = "aibr-router"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false
description = "Polyglot ingress admission router for AIBridge (ADR 0008)"

# The router's boundary is JSON over a socket plus the committed schemas in
# contracts/v1/. It must not acquire an upward import edge into `src/`, and
# `src/` must not acquire a dependency on this crate; there is no path
# declaration that could express either, which is the point.
[dependencies]
# `std` is REQUIRED, not merely convenient, and the reason is the generated code
# rather than this crate: typify emits `#[serde(untagged)]` and internally-tagged
# enums, and serde gates `de::ContentDeserializer`, `de::Content` and the
# `TaggedContentVisitor` family behind `std`/`alloc`. With only `derive` enabled
# the crate fails to compile with 400+ "found an item that was configured out"
# errors pointing at `contracts.rs`, which reads as a codegen bug rather than a
# missing feature. `alloc` alone is not enough either; the deserializer visitors
# need `std`.
serde = { version = "=1.0.228", features = ["derive", "std"], default-features = false }
serde_json = { version = "=1.0.150", features = ["std"], default-features = false }
# `regress` is not optional. typify compiles a JSON Schema `pattern` into a
# `::regress::Regex` held in a `LazyLock`, so a schema with a pattern does not
# merely lose validation without it — the generated crate does not build. The
# 27 committed schemas contain 1722 such references, so this is load-bearing from
# the first build rather than a future concern.
#
# A bounded-time engine rather than the `regex` crate: this is a TRUST BOUNDARY
# and ADR 0007 §17 refuses unbounded pattern semantics, so the dependency is
# chosen to match the threat model.
#
# `default-features = true` here, NOT `false` as originally written. `regress`'s
# `std` feature is what pulls in the standard library, and with it disabled the
# crate fails to compile in a way that names neither the feature nor the
# dependency: 23 errors about `std`, `Vec`, and `Box` not being found, reported
# from inside regress's own source. It is also the version the workspace lockfile
# had already resolved, so the pin matches what was tested rather than introducing
# a second version.
regress = { version = "=0.12.0" }

# --- M7.3: the serving surface -------------------------------------------------
#
# These four are the whole delta between "a crate that compiles" and "a router".
# Every one is pinned with `=` because the M7.1 spike measured this exact set and
# the milestone's resource numbers are only comparable to that measurement if the
# dependency graph is the same graph.

# `http1` is required by `axum::serve` and is the only protocol enabled: no
# `http2` means no h2 upgrade path onto the ingress socket, which is one less
# thing that can carry a body past the size cap below.
#
# `json` is required because every response body is produced by `axum::Json`, and
# because serde_json's `RawValue`/streaming bits are not what we use -- the body is
# read whole under a byte cap and parsed once.
#
# `tokio` is required for `axum::serve` and for the extractor runtime; it turns on
# `tower/make`, without which `into_make_service` does not exist.
#
# `ws` is DELIBERATELY ABSENT. This is the mechanism behind ADR 0008 §6's refusal:
# `WebSocketUpgrade` is gated behind this feature, so a build without it cannot
# construct a `101` response even in principle. The requirement was "the router
# answers 404 for `/v1/mesh/terminal`, never 101" -- excluding the feature makes
# that a property of the build rather than a property of a route table someone has
# to remember to keep correct.
#
# `tracing`, `tower-log`, `form`, `query`, `matched-path`, `original-uri` and
# `multipart` are all excluded because nothing in M7.3 uses them. `tracing` in
# particular would put a subscriber framework into a process whose RSS is gated at
# 4 MiB for a component that logs nothing yet; M7.10 owns the supervisor's log
# destination and should add instrumentation when there is something to record.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }

# `rt-multi-thread` rather than `rt`: the M7.1 baseline was captured with the
# multi-threaded runtime and reported 9 threads, so changing the runtime flavour
# would make the router's RSS un-comparable to the number the milestone gates
# against. `net` is the listener and the accept loop. `signal` is for the
# SIGTERM/SIGINT graceful shutdown M7.10's `systemd` unit needs -- without it a
# restart drops in-flight requests on the floor. `macros` is `#[tokio::main]`.
# `fs` and `io-util` are NOT enabled: the router performs no filesystem I/O of its
# own (M7.5's SQLite store will want them, and that is where they belong).
tokio = { version = "=1.53.1", default-features = false, features = [
    "rt-multi-thread",
    "net",
    "macros",
    "signal",
] }

# Constant-time equality for the bearer token.
#
# `subtle` over `ring`/`hmac`, and the reason is the build matrix rather than the
# API. `ring` compiles C and asm through a `cc` build script, which is precisely
# what M7.9's `cargo zigbuild` musl matrix is trying to avoid; `hmac` would need
# this crate to invent a keyed-MAC construction it does not have. `subtle` is pure
# Rust, pulls in nothing, and exposes exactly the one primitive needed. It is also
# the primitive Node's `crypto.timingSafeEqual` is: same constant-time contract,
# different language, so the replacement is comparable to what it replaces.
subtle = { version = "=2.6.1", default-features = false }

# Local interface address enumeration for the ADR 0008 §8 layer-1 preflight.
#
# The preflight must answer "is the configured bind address present on an
# interface on THIS host", and it must answer it WITHOUT binding. A probe
# `TcpListener::bind` would answer a different question -- "can I bind right now"
# -- which is a weaker property, has a TOCTOU window, and is the exact shape of the
# thing §8 forbids. `if_addrs` is the same data `ip addr` shows, read directly.
if-addrs = { version = "=0.15.0", default-features = false }

# Job id minting, for the `202` body M7.3 is required to return.
#
# `getrandom` rather than `fastrand`/`rand`: the id is an admission correlation
# token that a caller will hand back to `GET /jobs/:id`, and a predictable id is a
# capability to read someone else's admission. `fastrand` is explicitly not
# cryptographic and `rand`'s thread rng is seeded, but reseeding and platform
# dispatch are exactly the dependencies this crate does not want in a 4 MiB
# process. `getrandom` is a thin wrapper over `getrandom(2)`/`arc4random_buf`.
getrandom = { version = "=0.4.3", default-features = false }

# --- M7.5: the durable admission queue ------------------------------------------
#
# `202` is only truthful if the row is committed before the response is written
# (`SF-08`). That is not something a comment can assert, so the store is SQLite
# and this is the dependency that provides it.
#
# `bundled` compiles SQLite from source and is REQUIRED, not an optimisation.
# Without it `rusqlite` links the system `libsqlite3`, whose version is whatever
# the host happened to install. That matters twice here: M7.9's matrix is a set
# of Linux and Darwin images this repository does not build, and a `journal_mode
# = WAL` that silently stays `delete` because the host's library is too old is a
# durability regression that no test in `router/tests/` would notice, because the
# tests would be asserting against the host's SQLite and the deployment would be
# running against a different one. Compiling it in makes the store's behaviour a
# property of this lockfile.
#
# `default-features = false` with an explicit list rather than the crate's
# defaults. The defaults carry `backup`, `blob`, `series`, `trace`, `functions`,
# `limits`, `hooks`, `unlock_notify`, `vtab`, `array`, `i128_blob` and the
# `bundled-full` amalgamation, none of which this store calls; each one is C
# surface area in a process gated at 32 MiB and in a build matrix that would have
# to compile it nine times. `bundled` is the only one required.
#
# NOT enabled: `column_decltype` (no `SELECT *` in this module -- every query
# names its columns, which is also what makes the schema readable in a diff) and
# `modern-full` (it is `modern_sqlite` plus the features refused above).
#
# No `tokio` `sync`/`fs`/`io-util` features for this either. The connection is
# held behind a `std::sync::Mutex` and no `.await` occurs while the lock is held,
# so the store cannot deadlock against a suspension point, and it avoids adding a
# runtime feature to buy a `Mutex` that is held for the length of one fsync.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }

# SHA-256, for one thing: the idempotency key of a `/report` row.
#
# `default-features = false` leaves `std` off. `Digest::digest` needs nothing from
# the standard library beyond what `core` has, and the hex encoding is the one in
# `crate::outbox` rather than a dependency that would exist only to format 32
# bytes. `asm` is off so the build has no per-target C or asm shim to carry into
# M7.9's `cargo zigbuild` matrix.
#
# Why a digest is needed at all: `/trigger` converges on `job_id`, because one
# trigger creates one job and a repeated `job_id` is by definition the same job.
# `/report` is not that shape -- a job produces SEVERAL reports (`running`,
# `completed`, `failed`) and keying them on `job_id` would make
# `ON CONFLICT DO NOTHING` silently discard every report after the first, which is
# a lost callback to a peer rather than a converged retry. The key has to change
# when the observation changes, and the only part of the observation that changes
# is the payload.
sha2 = { version = "=0.11.0", default-features = false }

[dev-dependencies]
# `Router::oneshot` is how every request test in `router/tests/` is driven: no
# socket is created, so a test cannot pass because a listener happened to bind and
# cannot leave one behind. `ServiceExt` lives in `tower`, which axum does not
# re-export.
tower = { version = "=0.5.3", features = ["util"] }
# The same crate the router links, re-exposed to tests so
# `an_unknown_schema_version_is_refused` can stamp a newer `user_version` and
# observe the refusal. Not a second SQLite: the features match the `[dependencies]`
# entry exactly, so a test cannot accidentally assert against a different library
# than the binary uses.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }

# `[profile.release]` lived here until the workspace root moved to
# `../Cargo.toml`; Cargo honours profiles only at the root, so the table now
# lives there. It was copied verbatim, because the musl binary-size gate in
# `.github/workflows/milestone-7.yml` is calibrated on exactly those flags.

# `clippy::large_enum_variant` is allowed for the GENERATED module only, and the
# reason is that the lint's remedy is the wrong remedy here.
#
# `OrchestrationEvent` is a `#[serde(tag = "type")]` union whose variants are
# records of very different sizes; the largest embeds several nested payloads.
# Clippy suggests boxing the big variants. The generated file cannot be edited,
# and boxing would mean the generator emits a `Box` that every consumer must
# unwrap -- a schema change made in Rust that the committed JSON Schema does not
# describe, which is the mirror image of the divergence ADR 0008 §2.3 exists to
# prevent.
#
# The cost of allowing it is bounded and is not a memory hazard at this trust
# boundary: an event is decoded from a body already capped at 1 MiB, one at a
# time, and the enum lives in a process with a 32 MiB `MemoryMax`. The lint is
# aimed at arrays and enums multiplied by large counts; neither applies.
#
# Scoped to `contracts` rather than the crate so a hand-written enum in this
# binary still gets the lint.

