<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>

    <linearGradient id="cyanVioletGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="chevronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="960" height="260" rx="36" fill="url(#bgGrad)"/>
  <rect width="958" height="258" x="1" y="1" rx="35" fill="none" stroke="#222738" stroke-width="2"/>

  <!-- Subdued Grid Texture -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1.5">
    <path d="M40 70 h880 M40 130 h880 M40 190 h880"/>
    <path d="M100 20 v220 M200 20 v220 M300 20 v220 M700 20 v220 M800 20 v220"/>
  </g>

  <!-- ICON SECTION (Scale & Position on Left) -->
  <g transform="translate(48, 30) scale(0.39)">
    <!-- Base Spans -->
    <path d="M 104 368 L 408 368" stroke="#1e2436" stroke-width="14" stroke-linecap="round"/>
    <path d="M 128 368 L 384 368" stroke="url(#cyanVioletGrad)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

    <!-- Left Pylon -->
    <path d="M 148 368 L 176 156 L 196 156 L 208 368" fill="none" stroke="url(#cyanVioletGrad)" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Right Pylon -->
    <path d="M 304 368 L 316 156 L 336 156 L 364 368" fill="none" stroke="url(#cyanVioletGrad)" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Suspension Arc -->
    <path d="M 104 350 Q 186 168 256 220 Q 326 272 408 170" 
          fill="none" 
          stroke="url(#cyanVioletGrad)" 
          stroke-width="20" 
          stroke-linecap="round"
          filter="url(#cyanGlow)"/>

    <!-- Counter Cable -->
    <path d="M 104 170 Q 186 272 256 220 Q 326 168 408 350" 
          fill="none" 
          stroke="url(#cyanVioletGrad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-dasharray="10 12"
          opacity="0.6"/>

    <!-- Terminal Prompt in Arch -->
    <g transform="translate(256, 284)">
      <path d="M -36 -28 L -6 0 L -36 28" 
            fill="none" 
            stroke="url(#chevronGrad)" 
            stroke-width="12" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            filter="url(#cyanGlow)"/>
      <line x1="6" y1="26" x2="36" y2="26" stroke="#00f0ff" stroke-width="12" stroke-linecap="round"/>
    </g>

    <!-- Mesh Points -->
    <circle cx="104" cy="350" r="11" fill="#00f0ff" stroke="#0a0b10" stroke-width="4"/>
    <circle cx="408" cy="170" r="11" fill="#c084fc" stroke="#0a0b10" stroke-width="4"/>
    <circle cx="256" cy="220" r="12" fill="#10b981" stroke="#0a0b10" stroke-width="4" filter="url(#cyanGlow)"/>
  </g>

  <!-- TYPOGRAPHY SECTION -->
  <g transform="translate(280, 0)">
    <!-- Wordmark: AIBridge -->
    <text x="0" y="125" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" 
          font-size="80" 
          font-weight="800" 
          letter-spacing="-1.5"
          fill="url(#textGrad)">
      AI<tspan fill="url(#cyanVioletGrad)">Bridge</tspan>
    </text>

    <!-- CLI Binary Pill: aibr -->
    <g transform="translate(370, 68)">
      <rect width="84" height="34" rx="8" fill="#131724" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.6"/>
      <text x="42" y="23" 
            font-family="'JetBrains Mono', 'SF Mono', monospace" 
            font-size="16" 
            font-weight="700" 
            fill="#00f0ff" 
            text-anchor="middle">
        aibr
      </text>
    </g>

    <!-- Subtitle: Value Proposition -->
    <text x="2" y="170" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" 
          font-size="20" 
          font-weight="500" 
          fill="#94a3b8" 
          letter-spacing="0.2">
      Terminal-Native Control Plane for Private Mesh AI Agents
    </text>

    <!-- Badges / Metadata Line -->
    <g transform="translate(0, 196)">
      <!-- Mesh Secured Pill -->
      <g>
        <circle cx="6" cy="8" r="4" fill="#10b981"/>
        <text x="18" y="13" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#64748b">TAILSCALE MESH NATIVE</text>
      </g>
      <!-- Multi-Runtime Pill -->
      <g transform="translate(200, 0)">
        <text x="0" y="13" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#475569">•</text>
        <text x="14" y="13" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#64748b">OPENCODE • CLAUDE CODE • CODEX</text>
      </g>
    </g>
  </g>
</svg>
